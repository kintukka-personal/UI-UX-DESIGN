<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot Me Rating Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Nunito:wght@800;900&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  /* ---- Demo page only (not part of the component) ---- */
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 16px;
    min-height: 100dvh;
    background: #F3DDE2;
    font: 400 13px/1.5 "DM Sans", "Helvetica Neue", Arial, sans-serif;
    color: #7C5563;
  }

  /* A phone-sized frame on larger screens; the full screen on a phone. */
  .demo-phone {
    width: 390px;
    height: min(844px, calc(100dvh - 96px));
    min-height: 600px;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 0 0 10px #2A0F1C, 0 30px 60px -20px rgba(139, 18, 53, 0.45);
  }

  .demo-log { margin: 0; min-height: 1.5em; text-align: center; }
  .demo-log code { color: #8B1235; font-weight: 500; }

  @media (max-width: 500px), (max-height: 700px) and (max-width: 900px) {
    body { display: block; }
    .demo-phone { width: 100%; height: 100dvh; min-height: 0; border-radius: 0; box-shadow: none; }
    .demo-log { display: none; }
  }
</style>
</head>
<body>

<div class="demo-phone">
  <main class="ui-spot-rate" data-ui-spot-rate data-done-label="I rated!" aria-labelledby="ui-spot-rate-title">
    <header class="ui-spot-rate__top">
      <button class="ui-spot-rate__back" type="button" data-ui-spot-rate-back aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="ui-spot-rate__progress" role="progressbar" aria-label="Onboarding progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="96" style="--ui-spot-rate-progress: 96%"><span></span></div>
    </header>

    <div class="ui-spot-rate__intro">
      <!-- Spot Me wordmark: the "o" is the crush ring with a heart on top -->

      <h1 class="ui-spot-rate__title" id="ui-spot-rate-title">Hey, bestie!!</h1>
      <p class="ui-spot-rate__text">Help us grow with a quick rating. We love compliments!</p>
    </div>

    <div class="ui-spot-rate__hero">
      <!-- Five gold stars between two laurel branches -->

            <path d="M0 0C10 -10 30 -10 39 0C30 10 10 10 0 0" transform="translate(106.9 232.8) rotate(-207.4)"/>
            <path d="M0 0C8 -9 24 -9 33 0C24 9 8 9 0 0" transform="translate(97.3 229.8) rotate(-119.7)"/>
            <path d="M0 0C10 -11 30 -11 40 0C30 11 10 11 0 0" transform="translate(78.7 220.6) rotate(-189.8)"/>
            <path d="M0 0C8 -9 25 -9 33 0C25 9 8 9 0 0" transform="translate(70.5 214.9) rotate(-102.1)"/>
            <path d="M0 0C10 -11 31 -11 41 0C31 11 10 11 0 0" transform="translate(55.6 200.5) rotate(-172.2)"/>
            <path d="M0 0C9 -9 26 -9 34 0C26 9 9 9 0 0" transform="translate(49.5 192.6) rotate(-84.4)"/>
            <path d="M0 0C11 -11 32 -11 42 0C32 11 11 11 0 0" transform="translate(39.6 174.3) rotate(-154.6)"/>
            <path d="M0 0C9 -9 26 -9 35 0C26 9 9 9 0 0" transform="translate(36.3 164.9) rotate(-66.8)"/>
            <path d="M0 0C11 -11 33 -11 43 0C33 11 11 11 0 0" transform="translate(32.4 144.6) rotate(-136.9)"/>
            <path d="M0 0C9 -9 27 -9 36 0C27 9 9 9 0 0" transform="translate(32.0 134.6) rotate(-49.2)"/>
            <path d="M0 0C11 -12 33 -12 44 0C33 12 11 12 0 0" transform="translate(34.5 114.0) rotate(-119.3)"/>

            <path d="M0 0C10 -10 29 -10 39 0C29 10 10 10 0 0" transform="translate(100.0 41.3) rotate(21.3)"/>

          </g>

        <g class="ui-spot-rate__laurel" transform="translate(718 0) scale(-1 1)"><use href="#ui-spot-rate-laurel" style="animation-delay: 60ms"/></g>
        <g transform="translate(145 138)"><path class="ui-spot-rate__star" style="--i: 0" d="M0.0 -40.0L10.6 -14.6L38.0 -12.4L17.1 5.6L23.5 32.4L0.0 18.0L-23.5 32.4L-17.1 5.6L-38.0 -12.4L-10.6 -14.6Z"/></g>

        <g transform="translate(359 138)"><path class="ui-spot-rate__star" style="--i: 2" d="M0.0 -40.0L10.6 -14.6L38.0 -12.4L17.1 5.6L23.5 32.4L0.0 18.0L-23.5 32.4L-17.1 5.6L-38.0 -12.4L-10.6 -14.6Z"/></g>

      </svg>

        <defs>

        <circle class="ui-spot-rate__ring-track" cx="200" cy="200" r="168"/>
        <circle class="ui-spot-rate__ring-fill" cx="200" cy="200" r="168" transform="rotate(-30 200 200)"/>

        <g transform="translate(92 92) scale(0.72)">
          <circle class="ui-spot-rate__face-bg" cx="150" cy="150" r="150"/>
          <g clip-path="url(#ui-spot-rate-face)">

              <circle cx="92" cy="150" r="13" fill="#D89A6A"/>
              <circle cx="208" cy="150" r="13" fill="#D89A6A"/>
              <ellipse cx="150" cy="146" rx="58" ry="62" fill="#D89A6A"/>
              <!-- Side-swept fringe -->
              <path d="M90 150C84 96 112 70 152 70C192 70 218 98 210 150C204 124 194 108 178 100C168 112 150 118 132 116C112 118 98 128 90 150Z" fill="#4A2A1F"/>
              <path d="M178 100C176 92 170 86 162 82" fill="none" stroke="#5E3626" stroke-width="3" stroke-linecap="round"/>

              <path d="M114 124Q126 117 138 123M162 123Q174 117 186 124" fill="none" stroke="#4A2A1F" stroke-width="4" stroke-linecap="round"/>
              <path d="M116 145Q126 135 136 145M164 145Q174 135 184 145" fill="none" stroke="#5A1A2A" stroke-width="5" stroke-linecap="round"/>
              <ellipse cx="116" cy="162" rx="13" ry="7" fill="#F4899C" opacity="0.85"/>
              <ellipse cx="184" cy="162" rx="13" ry="7" fill="#F4899C" opacity="0.85"/>
              <path d="M141 168Q150 176 159 168" fill="none" stroke="#8B1235" stroke-width="4" stroke-linecap="round"/>
            </g></g>
          </g>
        </g>

        <g transform="translate(116 56) rotate(-28)">
          <path class="ui-spot-rate__heart" d="M0 26C-30 8 -38 -10 -30 -22C-23 -32 -8 -32 0 -18C8 -32 23 -32 30 -22C38 -10 30 8 0 26Z"/>
        </g>
      </svg>
    </div>

    <footer class="ui-spot-rate__actions">
      <button class="ui-spot-rate__cta" type="button" data-ui-spot-rate-cta><span class="ui-spot-rate__cta-label">Rate Spot Me</span></button>
      <button class="ui-spot-rate__skip" type="button" data-ui-spot-rate-skip hidden>Not now</button>
    </footer>
  </main>
</div>

<p class="demo-log" id="demo-log">Tap <strong>Rate Spot Me</strong> to see the events this screen fires.</p>

<script src="script.js"></script>
<script>
  // Demo only: show each event, and start over after "I rated!" or "Not now".
  (function () {
    var log = document.getElementById("demo-log");
    var screen = document.querySelector("[data-ui-spot-rate]");
    var notes = {
      request: "open the App Store / Play Store review prompt here",
      done: "the user says they rated, so go to the next step",
      skip: "the user skipped, so go to the next step",
      back: "go back to the previous onboarding step"
    };
    Object.keys(notes).forEach(function (name) {
      screen.addEventListener("ui-spot-rate:" + name, function () {
        log.innerHTML = "<code>ui-spot-rate:" + name + "</code> — " + notes[name];
        if (name === "done" || name === "skip") {
          setTimeout(function () { window.uiSpotRate.reset(screen); }, 1200);
        }
      });
    });
  })();
</script>
</body>
</html>
