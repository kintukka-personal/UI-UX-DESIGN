<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exploratory Gallery</title>
<meta name="description" content="Rico: an animated gallery of work. Glass cards slide past a lit slot, open into a focused view and a glass coin turns over the ticker.">
<meta name="theme-color" content="#BEBDC0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter+Tight:wght@400;500&display=swap">
<link rel="preload" as="image" href="images/product.webp" type="image/webp">
<link rel="stylesheet" href="style.css">
</head>
<body class="ui-gallery-page">

<main>

        <!-- 2. Product render -->
        <li class="ui-gallery__item" data-item data-title="Dial" data-kind="Industrial design" role="group" aria-roledescription="slide" aria-label="2 of 4">
          <button class="ui-gallery__card ui-gallery__card--photo ui-gallery__card--product" type="button" aria-label="Dial, industrial design" aria-describedby="ui-gallery-help">
            <span class="ui-gallery__inner" data-inner>
              <img src="images/product.webp" alt="" width="808" height="808" decoding="async" fetchpriority="high">
            </span>
          </button>
        </li>

        <!-- 3. Glass coin turning over a ticker -->
        <li class="ui-gallery__item" data-item data-title="Ledger" data-kind="Motion study" role="group" aria-roledescription="slide" aria-label="3 of 4">
          <button class="ui-gallery__card ui-gallery__card--coin" type="button" aria-label="Ledger, motion study: a glass coin turning over the tickers USD, XRP, BTC and ETH" aria-describedby="ui-gallery-help">
            <span class="ui-gallery__ticker" aria-hidden="true">
              <span class="ui-gallery__word" data-word-old>USD</span>
              <span class="ui-gallery__word" data-word-new></span>
            </span>
            <span class="ui-gallery__coinwrap" aria-hidden="true">
              <span class="ui-gallery__coin" data-coin>
                <span class="ui-gallery__face ui-gallery__face--front"></span>
                <span class="ui-gallery__face ui-gallery__face--back"></span>
              </span>
            </span>
          </button>
        </li>

        <!-- 4. Portrait -->
        <li class="ui-gallery__item" data-item data-title="Silhouette" data-kind="Portrait series" role="group" aria-roledescription="slide" aria-label="4 of 4">
          <button class="ui-gallery__card ui-gallery__card--photo ui-gallery__card--portrait" type="button" aria-label="Silhouette, portrait series" aria-describedby="ui-gallery-help">
            <span class="ui-gallery__inner" data-inner>
              <img src="images/portrait.webp" alt="" width="648" height="648" decoding="async">
            </span>
          </button>
        </li>
      </ul>

      <div class="ui-gallery__dim" aria-hidden="true"></div>
      <div class="ui-gallery__shade" aria-hidden="true"></div>
      <div class="ui-gallery__cursor" data-cursor aria-hidden="true"></div>
    </div>

    <footer class="ui-gallery__bar">
      <svg class="ui-gallery__logo" viewBox="0 0 64 16" role="img" aria-label="rico">
        <g fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 15V4H10"/>
          <path d="M14 4V15"/>
          <path d="M29.2 6.1A5.5 5.5 0 1 0 29.2 12.9"/>
          <circle cx="38" cy="9.5" r="5.5"/>
          <circle cx="49.4" cy="13" r="1.9" stroke-width=".6"/>
        </g>
        <path d="M48.8 14.1V11.9H49.6A.6 .6 0 0 1 49.6 13.1H48.8M49.5 13.1L50.1 14.1" fill="none" stroke="currentColor" stroke-width=".45"/>
      </svg>
      <span class="ui-gallery__label">Interactive</span>
      <span class="ui-gallery__count" data-count aria-hidden="true">1-04 (LITE)</span>

      <div class="ui-gallery__controls">
        <button class="ui-gallery__nav" type="button" data-prev>Previous project</button>
        <button class="ui-gallery__nav" type="button" data-next>Next project</button>
        <button class="ui-gallery__play" type="button" data-play>
          <span class="ui-gallery__play-icon" aria-hidden="true"></span>
          <span data-play-label>Pause</span><span class="ui-gallery__sr"> the gallery</span>
        </button>
      </div>
    </footer>

    <p class="ui-gallery__sr" data-live aria-live="polite" aria-atomic="true"></p>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
