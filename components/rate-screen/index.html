<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Rating Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  /* ---- Demo page only (not part of the component) ---- */
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 16px;
    min-height: 100dvh;
    background: #EDE5E5;
    font: 400 13px/1.5 "Poppins", "Helvetica Neue", Arial, sans-serif;
    color: #6F6565;
  }

  /* A phone-sized frame on larger screens; the full screen on a phone. */
  .demo-phone {
    width: 390px;
    height: min(844px, calc(100dvh - 96px));
    min-height: 600px;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 0 0 10px #1C1416, 0 30px 60px -20px rgba(40, 10, 15, 0.45);
  }

  .demo-log { margin: 0; min-height: 1.5em; text-align: center; }
  .demo-log code { color: #45161C; font-weight: 500; }

  @media (max-width: 500px), (max-height: 700px) and (max-width: 900px) {
    body { display: block; }
    .demo-phone { width: 100%; height: 100dvh; min-height: 0; border-radius: 0; box-shadow: none; }
    .demo-log { display: none; }
  }
</style>
</head>
<body>

<div class="demo-phone">
  <main class="ui-rate" data-ui-rate data-done-label="I rated" aria-labelledby="ui-rate-title">
    <header class="ui-rate__top">
      <button class="ui-rate__back" type="button" data-ui-rate-back aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="ui-rate__progress" role="progressbar" aria-label="Onboarding progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="96" style="--ui-rate-progress: 96%"><span></span></div>
    </header>

    <div class="ui-rate__intro">
      <h1 class="ui-rate__title" id="ui-rate-title">How is Cloey doing?</h1>
      <p class="ui-rate__text">Help us grow with a quick rating. Cloey loves compliments!</p>
    </div>

    <div class="ui-rate__hero">
      <!-- Five gold stars between two laurel branches -->

        <defs>
          <g id="ui-rate-laurel">

            <path d="M0 0C10 -10 30 -10 39 0C30 10 10 10 0 0" transform="translate(106.9 232.8) rotate(-207.4)"/>
            <path d="M0 0C8 -9 24 -9 33 0C24 9 8 9 0 0" transform="translate(97.3 229.8) rotate(-119.7)"/>
            <path d="M0 0C10 -11 30 -11 40 0C30 11 10 11 0 0" transform="translate(78.7 220.6) rotate(-189.8)"/>
            <path d="M0 0C8 -9 25 -9 33 0C25 9 8 9 0 0" transform="translate(70.5 214.9) rotate(-102.1)"/>
            <path d="M0 0C10 -11 31 -11 41 0C31 11 10 11 0 0" transform="translate(55.6 200.5) rotate(-172.2)"/>
            <path d="M0 0C9 -9 26 -9 34 0C26 9 9 9 0 0" transform="translate(49.5 192.6) rotate(-84.4)"/>
            <path d="M0 0C11 -11 32 -11 42 0C32 11 11 11 0 0" transform="translate(39.6 174.3) rotate(-154.6)"/>
            <path d="M0 0C9 -9 26 -9 35 0C26 9 9 9 0 0" transform="translate(36.3 164.9) rotate(-66.8)"/>
            <path d="M0 0C11 -11 33 -11 43 0C33 11 11 11 0 0" transform="translate(32.4 144.6) rotate(-136.9)"/>
            <path d="M0 0C9 -9 27 -9 36 0C27 9 9 9 0 0" transform="translate(32.0 134.6) rotate(-49.2)"/>
            <path d="M0 0C11 -12 33 -12 44 0C33 12 11 12 0 0" transform="translate(34.5 114.0) rotate(-119.3)"/>
            <path d="M0 0C9 -10 28 -10 37 0C28 10 9 10 0 0" transform="translate(37.1 104.4) rotate(-31.6)"/>

        <g transform="translate(466 138)"><path class="ui-rate__star" style="--i: 3" d="M0.0 -40.0L10.6 -14.6L38.0 -12.4L17.1 5.6L23.5 32.4L0.0 18.0L-23.5 32.4L-17.1 5.6L-38.0 -12.4L-10.6 -14.6Z"/></g>

          <ellipse cx="210" cy="138" rx="142" ry="106" fill="#262626"/>
          <path clip-path="url(#ui-rate-head)" d="M60 176C60 110 92 78 145 80C180 82 200 100 210 122C220 100 240 82 275 80C328 78 360 110 360 176L360 260L60 260Z" fill="#FFFFFF"/>
          <ellipse cx="210" cy="138" rx="142" ry="106" fill="none" stroke="#121212" stroke-width="6"/>

          <!-- Star eyes with little sparkles -->
          <g class="ui-rate__eyes">
            <g transform="translate(150 142)"><g class="ui-rate__twinkle">
              <path class="ui-rate__eye" transform="scale(1.75)" d="M0.0 -15.0L4.0 -5.5L14.3 -4.6L6.5 2.1L8.8 12.1L0.0 6.8L-8.8 12.1L-6.5 2.1L-14.3 -4.6L-4.0 -5.5Z"/>

            </g></g>
            <g transform="translate(270 142)"><g class="ui-rate__twinkle" style="animation-delay: -0.7s">

          <!-- Nose and mouth -->

        </g>
      </svg>
    </div>

    <footer class="ui-rate__actions">
      <button class="ui-rate__cta" type="button" data-ui-rate-cta><span class="ui-rate__cta-label">Rate Cloey</span></button>
      <button class="ui-rate__skip" type="button" data-ui-rate-skip hidden>Not now</button>
    </footer>
  </main>
</div>

<p class="demo-log" id="demo-log">Tap <strong>Rate Cloey</strong> to see the events this screen fires.</p>

<script src="script.js"></script>
<script>
  // Demo only: show each event, and start over after "I rated" or "Not now".
  (function () {
    var log = document.getElementById("demo-log");
    var screen = document.querySelector("[data-ui-rate]");
    var notes = {
      request: "open the App Store / Play Store review prompt here",
      done: "the user says they rated, so go to the next step",
      skip: "the user skipped, so go to the next step",
      back: "go back to the previous onboarding step"
    };
    Object.keys(notes).forEach(function (name) {
      screen.addEventListener("ui-rate:" + name, function () {
        log.innerHTML = "<code>ui-rate:" + name + "</code> — " + notes[name];
        if (name === "done" || name === "skip") {
          setTimeout(function () { window.uiRate.reset(screen); }, 1200);
        }
      });
    });
  })();
</script>
</body>
</html>
