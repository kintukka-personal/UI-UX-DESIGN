<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Card (Watch)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  /* ---- Demo page only: a phone frame to show the card in context ---- */
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 30% 20%, #3B3022, #110F0D 70%);
    font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 40px 16px;
    box-sizing: border-box;
  }
  .phone {
    position: relative;
    width: min(390px, 100%);
    padding: 10px;
    box-sizing: border-box;
    border-radius: 56px;
    background: #121312;
    box-shadow: 0 0 0 2px #2A2B2A, 0 40px 80px -30px rgba(40, 32, 24, 0.55);
  }
  .phone .ui-wcard {
    --ui-wcard-radius: 46;
    --ui-wcard-inset-top: 44px;
    max-width: none;
  }
  .phone__status {
    position: absolute;
    z-index: 5;
    top: 10px;
    left: 10px;
    right: 10px;
    height: 54px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 9% 0 11%;
    box-sizing: border-box;
    color: #F3F6F0;
    font-size: 16px;
    font-weight: 700;
    pointer-events: none;
  }
  .phone__island {
    position: absolute;
    left: 50%;
    top: 11px;
    width: 32%;
    height: 34px;
    transform: translateX(-50%);
    border-radius: 20px;
    background: #000;
  }
  .phone__icons { display: flex; gap: 6px; align-items: center; }
  .phone__icons svg { height: 12px; fill: currentColor; }
  .phone__home {
    position: absolute;
    z-index: 5;
    left: 50%;
    bottom: 18px;
    width: 134px;
    height: 5px;
    transform: translateX(-50%);
    border-radius: 3px;
    background: #EDE4D2;
    pointer-events: none;
  }
  .hint { max-width: 390px; margin: 20px auto 0; text-align: center; font-size: 13px; color: #A8997F; }
</style>
</head>
<body>
<main>
  <div class="phone">
    <div class="phone__status" aria-hidden="true">
      <span>9:41</span>
      <span class="phone__island"></span>
      <span class="phone__icons">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.3-1.4A10.6 10.6 0 0 0 8 .7 10.6 10.6 0 0 0 .7 3.6L2 5c1.6-1.5 3.7-2.4 6-2.4zm0 3.7c1.3 0 2.5.5 3.4 1.3l1.3-1.4A6.8 6.8 0 0 0 8 4.4c-1.8 0-3.4.7-4.7 1.8l1.3 1.4c.9-.8 2.1-1.3 3.4-1.3zM8 8.2c-.7 0-1.3.3-1.8.7L8 11l1.8-2.1c-.5-.4-1.1-.7-1.8-.7z"/></svg>
        <svg viewBox="0 0 27 12"><rect x="0.5" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="20" height="8" rx="2"/><path d="M25 4v4c.8-.3 1.3-1.1 1.3-2S25.8 4.3 25 4z" opacity="0.4"/></svg>
      </span>
    </div>

    <!-- ===== Component ===== -->
    <article class="ui-wcard" data-ui-wcard data-colorway="chrome">
      <div class="ui-wcard__inner">
        <div class="ui-wcard__stage" aria-hidden="true"></div>

        <header class="ui-wcard__bar">
          <button class="ui-wcard__icon" type="button" aria-label="Back">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          </button>
          <button class="ui-wcard__icon" type="button" aria-label="Cart, 1 item" data-ui-wcard-bag>
            <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
            <span class="ui-wcard__badge" aria-hidden="true">1</span>
          </button>
        </header>

        <p class="ui-wcard__specs">
          <span>Quartz watch</span>
          <span>FOSLN</span>
        </p>

        <h2 class="ui-wcard__title">
          <span aria-hidden="true">ACIER</span>
          <span class="ui-wcard__sr">FOSLN Acier quartz watch</span>
        </h2>

        <figure class="ui-wcard__media">
          <span class="ui-wcard__shadow" aria-hidden="true"></span>
          <span class="ui-wcard__float">
            <img class="ui-wcard__img is-active" data-colorway="chrome" src="images/acier-chrome.webp" width="687" height="1253" alt="FOSLN Acier watch with a chrome sunray dial" decoding="async">
            <img class="ui-wcard__img" data-colorway="onyx" src="images/acier-onyx.webp" width="687" height="1253" alt="FOSLN Acier watch with a black sunray dial" decoding="async" aria-hidden="true">
          </span>
        </figure>

        <div class="ui-wcard__body">
          <div class="ui-wcard__row">
            <p class="ui-wcard__price-label">Price <strong class="ui-wcard__price">$249</strong></p>

            <fieldset class="ui-wcard__swatches">
              <legend class="ui-wcard__sr">Colour</legend>
              <label class="ui-wcard__swatch" style="--swatch: linear-gradient(135deg, #F5F6F7 0%, #B6BBC1 45%, #E7E9EB 70%, #A2A7AD 100%)">
                <input type="radio" name="acier-colour" value="chrome" checked>
                <span class="ui-wcard__dot" aria-hidden="true"></span>
                <span class="ui-wcard__swatch-name">Chrome</span>
              </label>
              <label class="ui-wcard__swatch" style="--swatch: radial-gradient(circle at 35% 30%, #575A5F, #121315 62%)">
                <input type="radio" name="acier-colour" value="onyx">
                <span class="ui-wcard__dot" aria-hidden="true"></span>
                <span class="ui-wcard__swatch-name">Onyx</span>
              </label>
            </fieldset>
          </div>

          <button class="ui-wcard__cta" type="button">
            <span class="ui-wcard__cta-labels">
              <span class="ui-wcard__cta-add">
                <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Add to cart
              </span>
              <span class="ui-wcard__cta-done" aria-hidden="true">
                <svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 5"/></svg>Added
              </span>
            </span>
          </button>
          <p class="ui-wcard__sr" role="status" aria-live="polite" data-ui-wcard-status></p>
        </div>
      </div>
    </article>
    <!-- ===== /Component ===== -->

    <span class="phone__home" aria-hidden="true"></span>
  </div>
  <p class="hint">Pick a colour, then add it to the cart. On desktop, move the pointer over the card.</p>
</main>
<script src="script.js"></script>
</body>
</html>
