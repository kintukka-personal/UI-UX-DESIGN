<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"About Chef Brooke Silk","acceptedAnswer":{"@type":"Answer","text":"From her early days cooking alongside her grandmother to becoming a 3× consecutive World Dessert Champion of Australia, Chef Brooke Silk's culinary journey is as rich and flavorful as her dishes. With 18 years under her apron, including a distinguished tenure as a pastry chef, Brooke's passion evolved into Dine In. Dine In, born from Brooke's resilience during the first COVID lockdown, isn't just about meals; it's about crafting unforgettable dining moments. Discover the magic Brooke brings to every table, making every occasion not just a meal, but a memory."}},{"@type":"Question","name":"How Does It Work?","acceptedAnswer":{"@type":"Answer","text":"Chef Brooke Silk transforms your home or venue into an exclusive dining area, crafting a unique menu from local, seasonal produce tailored just for you and your guests. Check out our ’Experiences’ page for all we have offer. Discover the seamless process that brings gourmet dining to your venue. From initial contact to post-event cleanup, learn how Chef Brooke Silk tailors every aspect of your event for a truly bespoke experience."}},{"@type":"Question","name":"Where Do We Cater?","acceptedAnswer":{"@type":"Answer","text":"We service the Illawarra, South Coast, Highlands, and Greater Sydney. Dine In brings gourmet experiences to your doorstep, ensuring an unforgettable event wherever you are."}},{"@type":"Question","name":"What to Expect on the Day","acceptedAnswer":{"@type":"Answer","text":"On your special day, expect seamless culinary service from start to finish. Chef Brooke and her team will arrive beforehand to set up, prepare the menu as planned, and serve your guests, ensuring a memorable dining experience. Our team will also handle the cleanup, leaving your space as we found it."}},{"@type":"Question","name":"How Much Does It Cost?","acceptedAnswer":{"@type":"Answer","text":"The cost varies depending on the menu selected, the number of guests, and specific service requirements. We offer transparent pricing with no hidden fees. Contact us for a personalised quote tailored to your event's needs."}},{"@type":"Question","name":"Booking Confirmation and Payment","acceptedAnswer":{"@type":"Answer","text":"Your Dine In experience is confirmed with a 10% non-refundable booking fee of the total service cost. This secures your chosen date and Chef Brooke Silk’s exclusive services. Full payment is required 5 days prior to the event, along with your menu selections and dietary restrictions."}},{"@type":"Question","name":"What Kitchen Equipment Do I Need?","acceptedAnswer":{"@type":"Answer","text":"A standard kitchen setup is usually sufficient. We'll discuss specific requirements based on your chosen menu during the planning process. If additional equipment is needed, we can arrange rentals."}},{"@type":"Question","name":"Do I Need My Own Plates and Cutlery","acceptedAnswer":{"@type":"Answer","text":"For groups up to 25, Dine In supplies all necessary plates and cutlery, ensuring your event is beautifully served with no extra hassle for you. For larger gatherings, we're here to assist in organizing rental tableware to accommodate everyone. Should you wish to use special tableware to add a personal touch to your event, we're more than happy to incorporate it, ensuring your occasion is exactly as you envision."}},{"@type":"Question","name":"Do We Have to Clean?","acceptedAnswer":{"@type":"Answer","text":"No, you don’t have to worry about the cleanup. Dine In ensures that your kitchen and dining area are left spotless, allowing you to relax and enjoy your event to the fullest."}},{"@type":"Question","name":"Waitress Service","acceptedAnswer":{"@type":"Answer","text":"Elevate your dining experience with professional waitress service. Essential for larger gatherings, this service enhances the flow, timing, and overall guest experience. For events with more than six guests, waitress service is mandatory to ensure seamless coordination and premium service standards. Waitress service includes: Professional front-of-house guest service Course coordination and food service Clearing and resetting between courses Refilling water and maintaining table presentation Washing and packing away dining plates and cutlery used during meal service Cleaning down kitchen benches and service areas Sweeping and tidying kitchen floors post-service Assisting with event setup and pack down Supporting equipment loading and unloading Working closely with Chef Brooke to ensure smooth timing and execution Waitress service is $135 for the first 2 hours, with $25 for each additional hour. Please note: Standard waitress service covers dining-related service and general event support. Full glassware washing and polishing or extensive bar service can be arranged as an additional service upon request."}},{"@type":"Question","name":"Rescheduling Your Event","acceptedAnswer":{"@type":"Answer","text":"Unexpected changes? Learn how to reschedule your event hassle-free, including conditions for a complimentary rescheduling and any applicable fees for changes made close to the event date. Full details can be found here dine-in.com.au/cancellation-policy"}},{"@type":"Question","name":"Cancellation and Refund Policies","acceptedAnswer":{"@type":"Answer","text":"For peace of mind, our cancellation and refund policy outlines the terms for altering or cancelling your event. We offer flexible cancellation and rescheduling options. See our policy for full details. dine-in.com.au/cancellation-policy"}},{"@type":"Question","name":"Seasonal Menu Creation","acceptedAnswer":{"@type":"Answer","text":"Dine In’s menus evolve with the seasons. Every season, Chef Brooke Silk carefully curates new menus, leveraging the best local and seasonal produce available. These menus are crafted and announced one month before the start of each new season, ensuring your dining experience reflects the freshest flavors available. This process guarantees a unique, tailored dining experience that captures the essence of the season, every time you book with us."}},{"@type":"Question","name":"Experiences to Choose From","acceptedAnswer":{"@type":"Answer","text":"From intimate private dinners to lively cooking classes, explore the array of culinary experiences Dine In offers. Each designed to create lasting memories, whatever the occasion. Dine In offers a variety of experiences to match your occasion. Check out our ‘Experience’ page for more details, or the pages for weddings , corporate events and cooking classes ."}},{"@type":"Question","name":"Dietary Requirements","acceptedAnswer":{"@type":"Answer","text":"Your well-being is our priority at no extra cost. We tailor menus to cater to dietary restrictions and allergies, ensuring a delightful experience for every guest."}},{"@type":"Question","name":"Does Dine In Cater Weddings?","acceptedAnswer":{"@type":"Answer","text":"We cater to all romantic occasions, including surprise proposals, elopements, hen’s parties, honeymoons, anniversaries, and weddings. Our menus cater to both grand and intimate weddings, highlighted by our custom wedding package (get in touch for a copy). We prioritise transparency in our quoting process, ensuring no unexpected costs, so you can focus on celebrating your special day without worry. See wedding catering options"}},{"@type":"Question","name":"Can I Have a Birthday/Wedding Cake Instead?","acceptedAnswer":{"@type":"Answer","text":"Yes, you can. We can replace traditional dessert options with a customised birthday or wedding cake. Starting from $85 for naked/drip cakes. Just share your vision, and we’ll take care of creating a beautiful, delicious centerpiece for your celebration."}},{"@type":"Question","name":"Can I Customise My Menu?","acceptedAnswer":{"@type":"Answer","text":"Absolutely! We thrive on creating personalised menus that reflect your tastes and preferences. Let's discuss how we can tailor a menu that makes your event truly unique."}}]}</script>
