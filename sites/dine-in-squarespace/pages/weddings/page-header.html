<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Does Dine In Cater Weddings?","acceptedAnswer":{"@type":"Answer","text":"We cater to all romantic occasions, including surprise proposals, elopements, hen’s parties, honeymoons, anniversaries, and weddings. Our menus cater to both grand and intimate weddings, highlighted by our custom wedding package (get in touch for a copy). We prioritise transparency in our quoting process, ensuring no unexpected costs, so you can focus on celebrating your special day without worry."}},{"@type":"Question","name":"Can I Have a Birthday/Wedding Cake Instead?","acceptedAnswer":{"@type":"Answer","text":"Yes, you can. We can replace traditional dessert options with a customised birthday or wedding cake. Starting from $85 for naked/drip cakes. Just share your vision, and we’ll take care of creating a beautiful, delicious centerpiece for your celebration."}},{"@type":"Question","name":"Waitress Service","acceptedAnswer":{"@type":"Answer","text":"Elevate your dining experience with professional waitress service. Essential for larger gatherings, this service enhances the flow, timing, and overall guest experience. For events with more than six guests, waitress service is mandatory to ensure seamless coordination and premium service standards. Waitress service includes: Professional front-of-house guest service Course coordination and food service Clearing and resetting between courses Refilling water and maintaining table presentation Washing and packing away dining plates and cutlery used during meal service Cleaning down kitchen benches and service areas Sweeping and tidying kitchen floors post-service Assisting with event setup and pack down Supporting equipment loading and unloading Working closely with Chef Brooke to ensure smooth timing and execution Waitress service is $135 for the first 2 hours, with $25 for each additional hour. Please note: Standard waitress service covers dining-related service and general event support. Full glassware washing and polishing or extensive bar service can be arranged as an additional service upon request."}},{"@type":"Question","name":"Do I Need My Own Plates and Cutlery","acceptedAnswer":{"@type":"Answer","text":"For groups up to 25, Dine In supplies all necessary plates and cutlery, ensuring your event is beautifully served with no extra hassle for you. For larger gatherings, we're here to assist in organizing rental tableware to accommodate everyone. Should you wish to use special tableware to add a personal touch to your event, we're more than happy to incorporate it, ensuring your occasion is exactly as you envision."}},{"@type":"Question","name":"Dietary Requirements","acceptedAnswer":{"@type":"Answer","text":"Your well-being is our priority at no extra cost. We tailor menus to cater to dietary restrictions and allergies, ensuring a delightful experience for every guest."}},{"@type":"Question","name":"Booking Confirmation and Payment","acceptedAnswer":{"@type":"Answer","text":"Your Dine In experience is confirmed with a 10% non-refundable booking fee of the total service cost. This secures your chosen date and Chef Brooke Silk’s exclusive services. Full payment is required 5 days prior to the event, along with your menu selections and dietary restrictions."}}]}</script>
